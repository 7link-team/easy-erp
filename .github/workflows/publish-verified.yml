name: Publish verified build

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Build and release run ID
        required: true
        type: string
      tag:
        description: Unpublished version tag matching that build
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: publish-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_REPOSITORY: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag }}
      SOURCE_RUN: ${{ inputs.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify build provenance
        shell: bash
        run: |
          [[ "$SOURCE_RUN" =~ ^[0-9]+$ ]] || exit 1
          gh api "repos/$RELEASE_REPOSITORY/actions/runs/$SOURCE_RUN" > "$RUNNER_TEMP/build-run.json"
          test "$(jq -r .conclusion "$RUNNER_TEMP/build-run.json")" = success
          test "$(jq -r .head_sha "$RUNNER_TEMP/build-run.json")" = "$(git rev-parse HEAD)"
          test "$(jq -r .head_repository.full_name "$RUNNER_TEMP/build-run.json")" = "$RELEASE_REPOSITORY"
          test "$(jq -r .path "$RUNNER_TEMP/build-run.json")" = .github/workflows/build.yml
          test "$(gh api "repos/$RELEASE_REPOSITORY" --jq .private)" = false
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: release-assets
          merge-multiple: true
          pattern: '!*-evidence'
      - name: Validate artifacts and create draft
        shell: bash
        run: |
          node scripts/release-manifest.mjs
          policy=$(node scripts/release-channel.mjs)
          prerelease=$(echo "$policy" | sed -n 's/^prerelease=//p')
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true || exit 1
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "库存管理 $RELEASE_TAG" --notes "Verified build: $SOURCE_RUN; source: $(git rev-parse HEAD)"
          fi
          gh release edit "$RELEASE_TAG" --prerelease="$prerelease"
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
