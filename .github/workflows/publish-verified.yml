name: Publish verified build

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Build and release run ID
        required: true
        type: string
      tag:
        description: Unpublished version tag matching that build
        required: true
        type: string

permissions:
  actions: read
  contents: write
  packages: read

concurrency:
  group: publish-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_REPOSITORY: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag }}
      SOURCE_RUN: ${{ inputs.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify build provenance
        shell: bash
        run: |
          [[ "$SOURCE_RUN" =~ ^[0-9]+$ ]] || exit 1
          gh api "repos/$RELEASE_REPOSITORY/actions/runs/$SOURCE_RUN" > "$RUNNER_TEMP/build-run.json"
          test "$(jq -r .conclusion "$RUNNER_TEMP/build-run.json")" = success
          test "$(jq -r .head_sha "$RUNNER_TEMP/build-run.json")" = "$(git rev-parse HEAD)"
          test "$(jq -r .head_repository.full_name "$RUNNER_TEMP/build-run.json")" = "$RELEASE_REPOSITORY"
          test "$(jq -r .path "$RUNNER_TEMP/build-run.json")" = .github/workflows/build.yml
          test "$(gh api "repos/$RELEASE_REPOSITORY" --jq .private)" = false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # A release whose commit has no container image is a release Docker users
      # cannot install, and nothing noticed until someone tried to pull it:
      # v0.4.0, v0.10.0 and v0.11.1 all shipped that way, because a commit
      # outside the image workflow's paths filter never builds one and the
      # release event only tags an image that already exists. Check it here,
      # while the tag can still be moved.
      - name: Verify the tagged commit has a container image
        shell: bash
        run: |
          source="ghcr.io/$RELEASE_REPOSITORY-server:sha-$(git rev-parse HEAD)"
          docker buildx imagetools inspect "$source" --raw > "$RUNNER_TEMP/image.json" || {
            echo "No image for $source. Build it first: gh workflow run server-image.yml --ref $RELEASE_TAG"
            exit 1
          }
          jq -e '[.manifests[].platform | select(.os == "linux") | .architecture] | sort == ["amd64", "arm64"]' "$RUNNER_TEMP/image.json"
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: release-assets
          merge-multiple: true
          pattern: '!*-evidence'
      - name: Validate artifacts and create draft
        shell: bash
        run: |
          node scripts/release-manifest.mjs
          policy=$(node scripts/release-channel.mjs)
          prerelease=$(echo "$policy" | sed -n 's/^prerelease=//p')
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true || exit 1
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "库存管理 $RELEASE_TAG" --notes "Verified build: $SOURCE_RUN; source: $(git rev-parse HEAD)"
          fi
          gh release edit "$RELEASE_TAG" --prerelease="$prerelease"
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
