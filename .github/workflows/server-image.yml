name: Server container

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Version tag to attach to an existing verified image (leave empty to build)
        type: string
        default: ""
      image_maintenance:
        description: Audit or remove obsolete SHA versions (does not build)
        type: choice
        options: [none, audit, cleanup]
        default: none
  release:
    types: [published]
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "src/**"
      - "Cargo.*"
      - "package*.json"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/server-image.yml"
      - "scripts/smoke-server-image.mjs"

permissions:
  contents: read

concurrency:
  group: server-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sqlite:
    if: github.event_name != 'release' && !inputs.release_tag && (inputs.image_maintenance == '' || inputs.image_maintenance == 'none')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck:e2e
      - run: cargo fmt --all -- --check
      - run: cargo test --locked -p easy-erp-server
      - run: node --test scripts/tests/desktop-control.test.mjs scripts/tests/release-manifest.test.mjs scripts/tests/update-permissions.test.mjs
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: sqlite-browser-evidence
          path: build-artifacts/playwright/chromium/

  mysql:
    if: github.event_name != 'release' && !inputs.release_tag && (inputs.image_maintenance == '' || inputs.image_maintenance == 'none')
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: integration-only-password
          MYSQL_DATABASE: inventory
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pintegration-only-password"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      ERP_MYSQL_TEST_URL: mysql://root:integration-only-password@127.0.0.1:3306/inventory
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npm run build
      - run: cargo test --locked -p easy-erp-server
      - run: npx playwright install --with-deps chromium
      - name: Prepare isolated MySQL business test database
        run: docker exec ${{ job.services.mysql.id }} mysql -uroot -pintegration-only-password -e 'CREATE DATABASE business_checks CHARACTER SET utf8mb4 COLLATE utf8mb4_bin'
      - name: Verify inventory, sales, finance, imports and print configuration on MySQL
        env:
          ERP_DATABASE_URL: mysql://root:integration-only-password@127.0.0.1:3306/business_checks
        # These two tests edit SQLite files to simulate old archives/snapshots;
        # the regular build workflow runs them against SQLite.
        run: npx playwright test sales.spec.ts finance-periods.spec.ts queries.spec.ts reference-transfer.spec.ts --grep-invert '签字图片、资金与库存完整备份|分类使用历史快照和实际分摊'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: mysql-browser-evidence
          path: build-artifacts/playwright/chromium/

  build:
    needs: [sqlite, mysql]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          load: true
          tags: easy-erp-server:check
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=server-${{ matrix.arch }}
          cache-to: type=gha,scope=server-${{ matrix.arch }},mode=max
      - name: Verify initialization, embedded web and persistent restart
        run: node scripts/smoke-server-image.mjs easy-erp-server:check
      - name: Push verified architecture
        env:
          IMAGE: ghcr.io/${{ github.repository }}-server
          ARCH: ${{ matrix.arch }}
        run: |
          docker tag easy-erp-server:check "$IMAGE:sha-$GITHUB_SHA-$ARCH"
          docker push "$IMAGE:sha-$GITHUB_SHA-$ARCH"

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish both verified architectures
        env:
          IMAGE: ghcr.io/${{ github.repository }}-server
        run: |
          docker buildx imagetools create --tag "$IMAGE:sha-$GITHUB_SHA" --tag "$IMAGE:latest" \
            "$IMAGE:sha-$GITHUB_SHA-amd64" "$IMAGE:sha-$GITHUB_SHA-arm64"
          docker buildx imagetools inspect "$IMAGE:latest"


  version:
    if: github.event_name == 'release' || inputs.release_tag != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}-server
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag the verified image without rebuilding
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          SOURCE_SHA=$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")
          source="$IMAGE:sha-$SOURCE_SHA"
          docker buildx imagetools inspect "$source" --raw > source.json
          jq -e '[.manifests[].platform | select(.os == "linux") | .architecture] | sort == ["amd64", "arm64"]' source.json
          if docker buildx imagetools inspect "$IMAGE:$RELEASE_TAG" --raw > version.json 2> inspect-error.txt; then
            cmp source.json version.json || { echo "Refusing to overwrite a different version image"; exit 1; }
          else
            grep -Eqi 'not found|manifest_unknown|manifest unknown' inspect-error.txt || { cat inspect-error.txt; exit 1; }
            docker buildx imagetools create --tag "$IMAGE:$RELEASE_TAG" "$source"
          fi
          docker buildx imagetools inspect "$IMAGE:$RELEASE_TAG" --raw > version.json
          cmp source.json version.json
          docker buildx imagetools inspect "$IMAGE:$RELEASE_TAG"

  cleanup:
    if: inputs.image_maintenance == 'audit' || inputs.image_maintenance == 'cleanup'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
      IMAGE: ghcr.io/${{ github.repository }}-server
      PACKAGE_OWNER: ${{ github.repository_owner }}
      PACKAGE_NAME: ${{ github.event.repository.name }}-server
      IMAGE_MAINTENANCE: ${{ inputs.image_maintenance }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - run: node scripts/cleanup-server-images.mjs
