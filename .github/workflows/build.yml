name: Build and release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npm run build
      - run: cargo test --locked -p easy-erp-server
      - run: cargo build --locked -p easy-erp-server
      - run: node --test scripts/tests/desktop-control.test.mjs scripts/tests/release-manifest.test.mjs

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: cd dist && zip -r ../easy-erp-web.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: easy-erp-web.zip
          if-no-files-found: error

  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            bundles: dmg,app
          - runner: macos-15-intel
            target: aarch64-apple-darwin
            bundles: dmg,app
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb
    runs-on: ${{ matrix.runner }}
    env:
      ERP_BUILD_TARGET: ${{ matrix.target }}
      APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ vars.APPLE_DEVELOPMENT_TEAM }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            desktop -> target
          key: ${{ matrix.target }}
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev libfuse2
      - run: npm ci
      - name: Configure signed updater builds
        shell: bash
        env:
          UPDATER_PUBLIC_KEY: ${{ vars.UPDATER_PUBLIC_KEY }}
          UPDATER_ENDPOINT: ${{ vars.UPDATER_ENDPOINT }}
        run: node scripts/configure-updater.mjs
      - if: runner.os == 'macOS' && env.APPLE_CERTIFICATE != ''
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      - name: Build desktop installers
        shell: bash
        run: |
          for name in APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID APPLE_SIGNING_IDENTITY APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD TAURI_SIGNING_PRIVATE_KEY; do
            if [ -z "${!name}" ]; then unset "$name"; fi
          done
          npm run desktop:build -- --target "$ERP_BUILD_TARGET" --bundles '${{ matrix.bundles }}' --config updater-build.json
      - name: Collect installers
        run: node scripts/collect-release.mjs ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          path: release-assets/*
          if-no-files-found: error

  android:
    runs-on: ubuntu-24.04
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEYSTORE_TYPE: ${{ vars.ANDROID_KEYSTORE_TYPE || 'PKCS12' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop -> target
          key: android
          cache-on-failure: true
      - uses: gradle/actions/setup-gradle@v4
      - run: |
          sdkmanager 'ndk;27.2.12479018'
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run tauri -- android init --ci --skip-targets-install
      - run: node scripts/prepare-mobile-icons.mjs android
      - run: node scripts/prepare-android.mjs
      - run: sdkmanager "platforms;android-$ANDROID_COMPILE_SDK"
      - name: Build Android packages
        timeout-minutes: 45
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            npm run tauri -- android build --ci --target aarch64 armv7 x86_64 --apk --aab
          else
            if [[ "$GITHUB_REF" == refs/tags/* ]]; then
              echo 'Release builds require a stable Android signing key.' >&2
              exit 1
            fi
            npm run tauri -- android build --ci --debug --target aarch64 --apk
          fi
      - run: node scripts/collect-mobile.mjs android
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: release-assets/*
          if-no-files-found: error

  ios-simulator:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop -> target
          key: ios-simulator
          cache-on-failure: true
      - run: brew install xcodegen
      - run: npm ci
      - run: npm run tauri -- ios init --ci --skip-targets-install
      - run: node scripts/prepare-mobile-icons.mjs ios
      - name: Select simulator SDK in generated project
        run: |
          node scripts/prepare-ios-simulator.mjs
          cd desktop/gen/apple && xcodegen generate
      - run: npm run tauri -- ios build --ci --debug --target x86_64 --no-sign --archive-only
      - name: Package simulator application
        timeout-minutes: 15
        run: |
          APP=$(find desktop/gen/apple/build -type d -name '*.app' -print -quit)
          test -n "$APP"
          node scripts/smoke-ios-simulator.mjs "$APP"
          ditto -c -k --keepParent "$APP" easy-erp-ios-simulator.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-simulator-evidence
          path: simulator-evidence/*
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: ios-simulator
          path: easy-erp-ios-simulator.zip
          if-no-files-found: error

  ios-device:
    if: vars.IOS_SIGNING_ENABLED == 'true'
    runs-on: macos-15-intel
    env:
      APPLE_DEVELOPMENT_TEAM: ${{ vars.APPLE_DEVELOPMENT_TEAM }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop -> target
          key: ios-device
      - run: brew install xcodegen
      - name: Import iOS distribution identity
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: node scripts/prepare-ios-signing.mjs
      - run: npm ci
      - run: npm run tauri -- ios init --ci --skip-targets-install
      - run: node scripts/prepare-mobile-icons.mjs ios
      - run: npm run tauri -- ios build --ci --target aarch64 --export-method release-testing
      - run: node scripts/collect-mobile.mjs ios
      - uses: actions/upload-artifact@v4
        with:
          name: ios-device
          path: release-assets/*
          if-no-files-found: error
      - name: Remove temporary signing identity
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/easy-erp-signing.keychain-db" ]; then
            security delete-keychain "$RUNNER_TEMP/easy-erp-signing.keychain-db"
          fi

  release:
    if: >-
      always() && startsWith(github.ref, 'refs/tags/v') &&
      needs.checks.result == 'success' &&
      needs.web.result == 'success' && needs.desktop.result == 'success' &&
      needs.android.result == 'success' && needs.ios-simulator.result == 'success' &&
      (needs.ios-device.result == 'success' || needs.ios-device.result == 'skipped')
    needs: [checks, web, desktop, android, ios-simulator, ios-device]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
      RELEASE_REPOSITORY: ${{ vars.RELEASE_REPOSITORY || github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
          pattern: '!*-evidence'
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Build release manifest and checksums
        run: |
          test "$(gh api "repos/$RELEASE_REPOSITORY" --jq .private)" = false || { echo 'Automatic update assets require a public release repository.' >&2; exit 1; }
          node scripts/release-manifest.mjs
      - name: Create draft release
        run: |
          if gh release view "$RELEASE_TAG" --repo "$RELEASE_REPOSITORY" >/dev/null 2>&1; then
            test "$(gh release view "$RELEASE_TAG" --repo "$RELEASE_REPOSITORY" --json isDraft --jq .isDraft)" = true || { echo 'Refusing to replace a published release.' >&2; exit 1; }
          else
            gh release create "$RELEASE_TAG" --repo "$RELEASE_REPOSITORY" --draft --title "库存管理 $RELEASE_TAG" --notes "安装前请备份库存。Web 包需配合库存服务使用。iOS 模拟器包不是真机安装包；IPA 仅在已配置分发签名时提供。构建来源：$GITHUB_SHA"
          fi
          gh release upload "$RELEASE_TAG" --repo "$RELEASE_REPOSITORY" release-assets/* --clobber
