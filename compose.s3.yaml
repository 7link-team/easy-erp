# docker compose -f compose.yaml -f compose.s3.yaml up -d
# Use a dedicated bucket prefix per inventory instance. Never commit .env secrets.
services:
  inventory:
    environment:
      ERP_FILE_STORAGE: s3
      ERP_S3_BUCKET: ${ERP_S3_BUCKET:?Set ERP_S3_BUCKET}
      ERP_S3_REGION: ${ERP_S3_REGION:-us-east-1}
      ERP_S3_ACCESS_KEY_ID: ${ERP_S3_ACCESS_KEY_ID:?Set ERP_S3_ACCESS_KEY_ID}
      ERP_S3_SECRET_ACCESS_KEY: ${ERP_S3_SECRET_ACCESS_KEY:?Set ERP_S3_SECRET_ACCESS_KEY}
      ERP_S3_ENDPOINT: ${ERP_S3_ENDPOINT:-}
      ERP_S3_PREFIX: ${ERP_S3_PREFIX:-easy-erp}
      ERP_S3_PATH_STYLE: ${ERP_S3_PATH_STYLE:-true}
      ERP_S3_ALLOW_HTTP: ${ERP_S3_ALLOW_HTTP:-false}
