<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>库存管理 · 连接库存电脑</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <header class="welcome">
        <div class="brand-mark" aria-hidden="true">
          <svg
            viewBox="0 0 48 48"
            width="30"
            height="30"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path
              d="m24 5 17 9v20l-17 9L7 34V14l17-9Zm0 19L7 14m17 10 17-10M24 24v19M16 9l17 10v9"
            />
          </svg>
        </div>
        <span class="eyebrow">库存管理 · 桌面应用</span>
        <h1>选择库存保存位置</h1>
        <p>选择一次，下次直接进入库存管理。</p>
        <span id="saved-mode" class="saved-mode" hidden></span>
      </header>
      <section class="local-card">
        <div class="choice-heading">
          <h2>保存在这台电脑</h2>
          <span class="recommended">独立使用 / 保存库存，供同事连接</span>
        </div>
        <p>数据留在本机，打开应用即可使用。</p>
        <button id="local">
          使用本机并进入库存管理 <span aria-hidden="true">→</span>
        </button>
      </section>
      <section>
        <h2>连接已有库存电脑</h2>
        <p>多人共用一本库存账，填写管理员提供的地址。</p>
        <label for="address">库存电脑地址</label
        ><input
          id="address"
          type="url"
          placeholder="例如 http://192.168.1.20:4280"
        />
        <button id="connect" class="secondary">
          保存连接并进入 <span aria-hidden="true">→</span>
        </button>
      </section>
      <div id="saved-actions" class="saved-actions" hidden>
        <button id="retry" class="secondary">进入已保存的库存电脑</button
        ><button id="browser" class="text-button">在浏览器中打开 ↗</button>
      </div>
      <label class="check"
        ><input id="autostart" type="checkbox" />登录电脑后自动显示托盘</label
      >
      <p class="hint">
        关闭窗口后收起到托盘。可从应用菜单更换库存电脑或在浏览器中打开。
      </p>
      <button id="maintenance" class="secondary">本机数据维护</button>
      <p class="hint">无法启动时也可清空数据或恢复备份。</p>
      <p id="status" role="status"></p>
      <dialog
        id="recovery"
        aria-labelledby="recovery-title"
        aria-describedby="recovery-scope"
      >
        <h2 id="recovery-title">本机数据维护</h2>
        <p id="recovery-scope">仅操作这台电脑的数据，不会修改远程库存电脑。</p>
        <p id="recovery-remote" class="warning" hidden>
          当前连接的是远程库存电脑。以下操作只影响本机路径，不影响远程主机。
        </p>
        <p>
          本机数据：<strong id="recovery-data-dir"></strong
          ><br />本机备份：<span id="recovery-backups-dir"></span>
        </p>
        <label for="recovery-action">维护操作</label>
        <select id="recovery-action" name="recovery-action" autocomplete="off">
          <option value="reset">清空数据（不含备份数据）</option>
          <option value="restore">从备份恢复全部数据</option>
          <option value="clear-backups">清空本机全部备份</option>
        </select>
        <p id="recovery-description" class="warning"></p>
        <div id="recovery-source" hidden>
          <label for="recovery-backup">选择本机备份</label>
          <select
            id="recovery-backup"
            name="recovery-backup"
            autocomplete="off"
          >
            <option value="">请选择备份</option>
          </select>
          <p id="recovery-backup-detail" class="hint"></p>
          <button id="recovery-pick" class="secondary">
            选择其他备份文件（ZIP / 旧版）
          </button>
          <p id="recovery-external" class="hint"></p>
        </div>
        <label id="recovery-confirm-label" for="recovery-confirm"></label>
        <input
          id="recovery-confirm"
          name="recovery-confirm"
          type="text"
          inputmode="text"
          autocomplete="off"
          spellcheck="false"
          aria-describedby="recovery-description recovery-status"
        />
        <label class="check"
          ><input
            id="recovery-restart"
            name="recovery-restart"
            autocomplete="off"
            type="checkbox"
          />完成后立即启动本机库存管理</label
        >
        <p class="hint">
          不勾选可先完成维护，再手动启动。维护期间会安全停止本机共享。
        </p>
        <p id="recovery-status" role="status" aria-live="polite"></p>
        <div class="recovery-actions">
          <button id="recovery-submit" class="danger" disabled>执行维护</button>
          <button id="recovery-refresh" class="secondary">刷新备份</button>
          <button id="recovery-close" class="secondary">关闭</button>
        </div>
      </dialog>
    </main>
    <script src="app.js"></script>
  </body>
</html>
